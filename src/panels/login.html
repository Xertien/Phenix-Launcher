<div class="container">
    <div class="login-home login-tabs">
        <img class="login-logo" src="assets/images/icon.png" alt="" />
        <div class="login-heading">
            <div class="login-text">Connexion</div>
            <p class="login-subtitle">Connectez-vous avec votre compte Microsoft pour jouer.</p>
        </div>

        <div class="login-options">
            <div class="button-container">
                <button class="connect connect-home">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 23 23"
                        fill="currentColor" aria-hidden="true">
                        <path d="M0 0h11v11H0z" />
                        <path d="M12 0h11v11H12z" />
                        <path d="M0 12h11v11H0z" />
                        <path d="M12 12h11v11H12z" />
                    </svg>
                    Connexion Microsoft
                </button>
            </div>

            <button class="cancel cancel-home" hidden>Annuler</button>
        </div>
    </div>

    <div class="login-offline login-tabs">
        <img class="login-logo" src="assets/images/icon.png" alt="" />
        <div class="login-heading">
            <div class="login-text">Connexion</div>
            <p class="login-subtitle">Veuillez entrer votre pseudo.</p>
        </div>

        <div class="input-login">
            <input type="text" class="email email-offline" placeholder="Pseudo" aria-label="Pseudo" />
        </div>

        <div class="login-options">
            <button class="connect connect-offline">Connexion</button>
            <button class="cancel cancel-offline" hidden>Annuler</button>
        </div>
    </div>

    <div class="login-AZauth login-tabs">
        <img class="login-logo" src="assets/images/icon.png" alt="" />
        <div class="login-heading">
            <div class="login-text">Connexion</div>
            <p class="login-subtitle">Veuillez vous connecter pour jouer.</p>
        </div>

        <div class="input-login">
            <input type="text" class="email email-AZauth" placeholder="E-mail" aria-label="E-mail" />
            <input type="password" class="password password-AZauth" placeholder="Mot de passe" aria-label="Mot de passe" />
        </div>

        <div class="login-options">
            <button class="connect connect-AZauth">Connexion</button>
            <button class="cancel cancel-AZauth" hidden>Annuler</button>
        </div>
    </div>

    <div class="login-AZauth-A2F login-tabs">
        <img class="login-logo" src="assets/images/icon.png" alt="" />
        <div class="login-heading">
            <div class="login-text">Double authentification</div>
            <p class="login-subtitle">Veuillez entrer le code de double authentification.</p>
        </div>

        <div class="input-login">
            <input type="text" class="A2F A2F-AZauth" placeholder="Code" aria-label="Code" />
        </div>

        <div class="login-options">
            <button class="connect connect-AZauth-A2F">Valider</button>
            <button class="cancel cancel-AZauth-A2F">Annuler</button>
        </div>
    </div>
</div>
