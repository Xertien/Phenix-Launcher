<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
        <link rel="stylesheet" href="assets/css/index.css">
    </head>
    <body class="dark global">
        <div id="splash" data-state="checking">
            <main class="splash-main">
                <img class="splash" src="assets/images/icon.png" alt="" />
                <p class="splash-brand">Phénix Launcher</p>
                <p class="splash-message"></p>
                <p class="splash-author"><span class="author"></span></p>
            </main>
            <section class="status" aria-live="polite">
                <p class="message">Recherche de mise à jour...</p>
                <p class="status-detail" hidden></p>
                <div class="progress" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar"></div>
                </div>
                <p class="progress-text" hidden></p>
                <button type="button" class="download-update" hidden>Télécharger</button>
                <p class="status-countdown" hidden></p>
            </section>
        </div>
        <script src="assets/js/utils/security.js"></script>
        <script src="assets/js/index.js" type="module"></script>
    </body>
</html>
